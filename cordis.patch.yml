# dsh-token-burner —— 插件自带的 bundle patch
# 安装方式同 dsh-session-delete：profile 的 dsh.profile.bundles 里列出包名，
# 或直接在 profile 的 cordis.patch.yml 里 insert 同一行（本机即此装法）。

- insert:
    - id: token-burner
      name: dsh-token-burner
      config:
        defaultConcurrency: 8
        defaultRequests: 16
        defaultMaxTokens: 16384
        defaultRounds: 3
        maxConcurrency: 64
        maxRequests: 512
        maxRounds: 16
        defaultRecheckTimes: 1000
        maxRecheckTimes: 10000
        recheckConcurrency: 8
        maxRecheckConcurrency: 32
        # 每次请求前插一个随机数，让 prompt cache 命不中
        cacheBust: true
